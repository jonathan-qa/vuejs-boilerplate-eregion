# This is a sample build configuration for JavaScript.
# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
# -----
# You can specify a custom docker image from Docker Hub as your build environment.
image: node:10.15.3

clone:
  depth: full

options:
  max-time: 10

pipelines:
  default:
    - step:
          name: code_analyse
          caches:
            - npm
          script:
            - npm ci
            - npm run lint
    - step:
          name: unit_tests
          caches:
            - npm
          script:
            - npm ci
            - npm run test:unit
    - step:
           name: performance_tests
           caches:
             - npm
           image: cypress/base:10
           script:
             - npm ci
             - npm install -g newman
             - npm run serve &
             - |
               ready=0
               for i in $(seq 1 60); do
                 if curl -sf "http://localhost:8080/" >/dev/null; then
                   ready=1
                   break
                 fi
                 sleep 2
               done
               if [ "$ready" -ne 1 ]; then
                 echo "Timed out waiting for application server"
                 exit 1
               fi
             - npm run test:performance

    - step:
           name: e2e_tests
           caches:
             - npm
             - cypress
           image: cypress/base:10
           script:
             - ./run_e2e_tests.sh
  branches:
    master:
      - step:
            name: code_analyse
            caches:
              - npm
            script:
              - npm ci
              - npm run lint
      - step:
            name: build
            caches:
              - npm
            script:
              - ./build.sh
      - step:
            name: heroku
            script:
              - npm install -g heroku
              - printf 'machine git.heroku.com\n  login heroku\n  password %s\n' "$HEROKU_API_KEY" > ~/.netrc
              - chmod 600 ~/.netrc
              - git push "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD
definitions:
  caches:
    npm: ~/.npm
    cypress: ~/.cache